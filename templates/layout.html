<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Drogueria{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site">
        <div class="site-inner">
            <div class="brand">
                <span class="mark"></span>
                <span>Drogueria</span>
            </div>
            <nav class="nav">
                {% if session.get('usuario_id') %}
                    <a href="{{ url_for('listar_productos') }}">Productos</a>
                    <a href="{{ url_for('nuevoproducto') }}">Nuevo</a>
                    <a class="logout" href="{{ url_for('logout') }}">Cerrar sesión</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container">
        {% with mensajes = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in mensajes %}
                <div class="alert {{ cat }}">
                    <span>{{ msg }}</span>
                    <button type="button" class="alert-close" aria-label="Cerrar mensaje">×</button>
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site">
        <p>Droguería - Sistema de gestión de inventario</p>
    </footer>

    <script>
        document.querySelectorAll('.alert-close').forEach(function (button) {
            button.addEventListener('click', function () {
                var alertBox = button.closest('.alert');
                if (alertBox) {
                    alertBox.classList.add('closing');
                    setTimeout(function () {
                        alertBox.remove();
                    }, 180);
                }
            });
        });

        document.querySelectorAll('.alert').forEach(function (alertBox) {
            setTimeout(function () {
                if (alertBox.parentNode) {
                    alertBox.classList.add('closing');
                    setTimeout(function () {
                        if (alertBox.parentNode) {
                            alertBox.remove();
                        }
                    }, 180);
                }
            }, 4000);
        });
    </script>
</body>
</html>
