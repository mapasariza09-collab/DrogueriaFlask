{% extends "layout.html" %}
{% block title %}Iniciar sesion{% endblock %}
{% block content %}
<div class="login-wrap">
    <div class="card login-card">
        <h1>Iniciar sesión</h1>
        <form method="post">
            <label>Correo electrónico</label>
            <input type="email" name="correo" required autocomplete="username">

            <label>Contraseña</label>
            <input type="password" name="contrasena" required autocomplete="current-password">

            <button type="submit" class="btn">Entrar</button>
        </form>
        <p style="margin-top:16px;">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Registrate</a></p>
    </div>
</div>
{% endblock %}
